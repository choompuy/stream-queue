name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  # The Windows executable is what streamers actually run: a build that breaks only there should show up before a release
  build-exe:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: npm ci

      - name: Build the release folder
        run: npm run build:release
        env:
          # baked into the exe: without it the Twitch integration of the artifact stays off
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: stream-queue-windows
          path: release/
          if-no-files-found: error
