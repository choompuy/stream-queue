name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  # The Windows executable is what streamers actually run: a build that breaks only there should show up before a release
  build-exe:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the release folder
        run: npm run build:release

      - uses: actions/upload-artifact@v4
        with:
          name: stream-queue-windows
          path: release/
          if-no-files-found: error
