<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="css/overlay.css" />
    <title>StreamQueue - Overlay</title>
  </head>
  <body>
    <div class="container">
      <div class="badge hidden" id="badge">
        <img class="thumbnail" id="currentThumbnail" alt="" />

        <div class="now-playing-info">
          <div class="now-playing">
            <div class="title text-sm truncate" id="currentTitle"></div>
            <div class="text-xs text-green truncate" id="currentRequester"></div>
            <div class="progress-wrapper">
              <div class="progress">
                <div id="progressBar"></div>
              </div>
              <div class="time text-xs text-secondary">
                <div id="elapsedTime">0:00 / 0:00</div>
              </div>
            </div>
          </div>

          <div class="now-playing-video" id="nowPlayingVideo">
            <div id="player"></div>
          </div>

          <div class="next-playing hidden" id="nextPlaying">
            <div class="prefix text-secondary text-xs" data-i18n="nowPlaying.next">NEXT</div>
            <div class="flex-1 text-xs truncate" id="nextTitle"></div>
            <div class="text-secondary text-xs" id="nextElapsedTime">0:00</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/i18n.js"></script>
    <script type="module" src="js/overlay.js"></script>
  </body>
</html>
