<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/preview.css" />
    <title>Song Preview</title>
  </head>
  <body>
    <div class="container">
      <div class="badge-wrapper" id="badgeWrapper">
        <div class="badge" id="badge">
          <img class="thumbnail" id="currentThumbnail" alt="" />

          <div class="now-playing-info">
            <div class="now-playing">
              <div class="title text-sm truncate" id="currentTitle"></div>
              <div class="text-xs text-green truncate" id="currentRequester"></div>
              <div class="progress-wrapper">
                <div class="progress">
                  <div id="progressBar"></div>
                </div>
                <div class="time text-xs text-secondary">
                  <div id="elapsedTime">0:00 / 0:00</div>
                </div>
              </div>
            </div>

            <div class="next-playing" id="nextPlaying">
              <div class="prefix text-secondary text-xs">NEXT</div>
              <div class="flex-1 text-xs truncate" id="nextTitle"></div>
              <div class="text-secondary text-xs" id="nextElapsedTime">0:00</div>
            </div>
          </div>
        </div>
      </div>

      <div class="player-wrapper hidden" id="playerWrapper">
        <div id="player"></div>
      </div>
    </div>

    <script type="module" src="js/preview.js"></script>
  </body>
</html>
